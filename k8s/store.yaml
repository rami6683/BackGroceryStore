# Mot de passe MySQL partagé par la base et l'application
# (valeur de développement, à changer en production)
apiVersion: v1
kind: Secret
metadata:
  name: store-db-secret
stringData:
  password: root6683
---
# Stockage persistant de MySQL : les données survivent à la suppression du pod
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Base de données MySQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate        # le volume ne peut être monté que par un seul pod à la fois
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_DATABASE
              value: storeDB
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: store-db-secret
                  key: password
          ports:
            - containerPort: 3306
          readinessProbe:   # le pod reçoit du trafic seulement quand MySQL accepte les connexions
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-pvc
---
# Nom DNS "db" dans le cluster : c'est l'hôte utilisé dans l'URL JDBC de l'application
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
---
# Application Spring Boot
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-app
  template:
    metadata:
      labels:
        app: store-app
    spec:
      initContainers:
        # Attend que MySQL réponde avant de démarrer l'application (évite des redémarrages au premier lancement)
        - name: wait-for-db
          image: mysql:8.4               # déjà téléchargée pour la base, fournit mysqladmin
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: store-db-secret
                  key: password
          command: ["sh", "-c", "until mysqladmin ping -h db -p$MYSQL_ROOT_PASSWORD; do sleep 2; done"]
      containers:
        - name: store-app
          image: store-app:latest        # image construite localement : docker build -t store-app:latest .
          imagePullPolicy: IfNotPresent  # ne pas chercher l'image sur un registre distant
          env:
            # Remplacent les valeurs de application.properties (comme dans docker-compose.yml)
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://db:3306/storeDB
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: store-db-secret
                  key: password
          ports:
            - containerPort: 8080
---
# Accès à l'application depuis la machine : http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: store-app
spec:
  type: NodePort
  selector:
    app: store-app
  ports:
    - port: 8080
      nodePort: 30080
